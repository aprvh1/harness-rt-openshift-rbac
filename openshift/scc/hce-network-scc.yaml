apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: hce-network-scc
  labels:
    app.kubernetes.io/name: hce
    app.kubernetes.io/component: scc
    app.kubernetes.io/part-of: harness-chaos-engineering
  annotations:
    kubernetes.io/description: "SCC for network manipulation faults (pod-network-latency, pod-network-loss, pod-network-corruption, node-network-latency, node-network-loss)"
allowPrivilegedContainer: true
allowPrivilegeEscalation: true
allowHostDirVolumePlugin: true
allowHostNetwork: true
allowHostPID: true
allowHostPorts: false
allowHostIPC: false
allowedCapabilities:
- NET_ADMIN
defaultAddCapabilities: []
requiredDropCapabilities: []
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
- configMap
- downwardAPI
- emptyDir
- hostPath
- persistentVolumeClaim
- projected
- secret
readOnlyRootFilesystem: false
users: []
groups: []
priority: null
