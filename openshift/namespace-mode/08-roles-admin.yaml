apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hce-admin-role
  namespace: hce
  labels:
    app.kubernetes.io/name: hce
    app.kubernetes.io/component: chaos-admin-role
    app.kubernetes.io/part-of: harness-chaos-engineering
rules:
- apiGroups: [""]
  resources: [pods, pods/log, pods/exec, configmaps, secrets, services, events, serviceaccounts]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [apps]
  resources: [deployments, statefulsets, replicasets, daemonsets]
  verbs: [create, delete, get, list, patch, update]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [roles, rolebindings]
  verbs: [create, delete, get, list, patch, update]
