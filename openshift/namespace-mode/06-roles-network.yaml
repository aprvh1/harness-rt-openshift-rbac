apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hce-network-role
  namespace: hce
  labels:
    app.kubernetes.io/name: hce
    app.kubernetes.io/component: chaos-role
    app.kubernetes.io/part-of: harness-chaos-engineering
  annotations:
    kubernetes.io/description: "Role for pod-level network faults only (pod-network-latency, pod-network-loss, pod-network-corruption)"
rules:
- apiGroups: [""]
  resources: [pods, events, pods/log, pods/exec]
  verbs: [create, delete, get, list, patch, update, deletecollection]
- apiGroups: [apps]
  resources: [deployments, statefulsets, replicasets, daemonsets]
  verbs: [get, list]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, delete, get, list, deletecollection]
