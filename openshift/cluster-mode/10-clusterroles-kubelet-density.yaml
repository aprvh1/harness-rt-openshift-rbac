apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hce-kubelet-density-clusterrole
  labels:
    app.kubernetes.io/name: hce
    app.kubernetes.io/component: chaos-clusterrole
    app.kubernetes.io/part-of: harness-chaos-engineering
  annotations:
    kubernetes.io/description: "For kubelet-density fault"
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list]
- apiGroups: [""]
  resources: [pods, events, pods/log]
  verbs: [create, delete, get, list, patch, update, deletecollection]
- apiGroups: [apps]
  resources: [deployments, statefulsets, replicasets, daemonsets]
  verbs: [get, list]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, delete, get, list, deletecollection]
